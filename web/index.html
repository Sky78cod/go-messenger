<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#bb24ce">
  <meta name="description" content="Go Messenger — личные сообщения и общий чат в реальном времени.">
  <title>Go Messenger</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <section id="auth-view" class="auth-wrap" aria-labelledby="auth-title" hidden>
    <div class="auth-card">
      <div class="auth-logo" aria-hidden="true">♥</div>
      <h1 id="auth-title">Go Messenger</h1>
      <p class="auth-lead">Твой собственный мессенджер на Go</p>
      <div class="mode-tabs" role="group" aria-label="Выберите действие">
        <button id="tab-login" class="mode-tab selected" type="button">Войти</button>
        <button id="tab-register" class="mode-tab" type="button">Регистрация</button>
      </div>
      <form id="auth-form" autocomplete="on">
        <label for="auth-username">Имя пользователя</label>
        <input id="auth-username" name="username" autocomplete="username" pattern="[A-Za-z0-9_]{3,30}" maxlength="30" required placeholder="Например, alex123">
        <label for="auth-password">Пароль</label>
        <input id="auth-password" name="password" type="password" autocomplete="current-password" required placeholder="Введи пароль">
        <p id="auth-hint" class="helper">Используй имя и пароль, с которыми зарегистрировался.</p>
        <p id="auth-error" class="form-error" role="alert" aria-live="polite"></p>
        <button id="auth-submit" class="primary-btn" type="submit">Войти в аккаунт</button>
      </form>
    </div>
  </section>

  <div id="app-view" class="layout" hidden>
    <aside id="sidebar" class="sidebar" aria-label="Список чатов">
      <div class="sidebar-brand">
        <div class="brand-heart" aria-hidden="true">♥</div>
        <div><div class="brand-name">Go Messenger</div><div class="brand-sub">Общайся в моменте</div></div>
      </div>
      <div class="user-card">
        <div id="my-avatar" class="avatar avatar-me">?</div>
        <div class="user-card-info"><strong id="my-name">Пользователь</strong><span class="small-muted">Мой аккаунт</span></div>
        <button id="logout" class="icon-btn" title="Выйти из аккаунта" aria-label="Выйти"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h6a3 3 0 013 3v12a3 3 0 01-3 3h-6"/></svg></button>
      </div>
      <div class="side-caption">ЧАТЫ</div>
      <button id="general-chat" class="chat-entry active" type="button">
        <span class="chat-entry-icon">#</span><span class="chat-entry-main"><strong>Общий чат</strong><small>Все участники</small></span>
      </button>
      <div class="side-caption people-caption"><span>ЛИЧНЫЕ СООБЩЕНИЯ</span><button id="refresh-users" class="refresh-btn" title="Обновить список" aria-label="Обновить список">↻</button></div>
      <div id="user-list" class="user-list" aria-label="Пользователи"></div>
      <div class="sidebar-footer">Go + PostgreSQL + WebSocket</div>
    </aside>

    <main class="chat-panel" aria-label="Переписка">
      <header class="chat-header">
        <button id="menu-toggle" class="icon-btn mobile-menu" aria-label="Открыть список чатов">☰</button>
        <div id="chat-avatar" class="header-avatar">#</div>
        <div class="chat-header-info"><h1 id="chat-title">Общий чат</h1><span id="chat-subtitle">Публичная комната</span></div>
        <span id="connection" class="connection-status"><span class="connection-dot"></span><span id="connection-label">Подключение…</span></span>
      </header>
      <div id="messages" class="messages" role="log" aria-label="Сообщения" aria-live="polite"></div>
      <div id="typing-indicator" class="typing-indicator" aria-live="polite"></div>
      <form id="send-form" class="composer">
        <label class="sr-only" for="message-input">Сообщение</label>
        <input id="message-input" maxlength="1000" autocomplete="off" placeholder="Напиши сообщение…" required>
        <button id="send" class="send-heart" type="submit" title="Отправить" aria-label="Отправить" disabled>➤</button>
      </form>
    </main>
    <button id="sidebar-overlay" class="sidebar-overlay" aria-label="Закрыть список чатов" hidden></button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
