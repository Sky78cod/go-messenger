name: go-messenger
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-messenger_dev}
      POSTGRES_DB: messenger
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://messenger:${POSTGRES_PASSWORD:-messenger_dev}@db:5432/messenger?sslmode=disable"
      APP_ENV: development
      LISTEN_ADDR: ":8080"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  # Preserve the old go-messenger_postgres_data volume when upgrading from
  # the earlier local Compose project. Never use 'down -v' for upgrades.
  postgres_data:
